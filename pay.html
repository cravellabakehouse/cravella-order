<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Pay for your order · Cravella Bake House</title>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<style>
:root{--bg:#fffdf6;--card:#fff;--ink:#3b2416;--mut:#7d6a58;--line:#eadfc9;--acc:#b4532a;--acc-ink:#fff;--ok:#2f7d4f;--warn-bg:#fff4e4;--warn-line:#f0dcb8;--warn-ink:#7a5a30}
@media (prefers-color-scheme:dark){:root{--bg:#1d1612;--card:#271e18;--ink:#f6ece0;--mut:#b5a393;--line:#3c2f26;--acc:#e08a5e;--acc-ink:#2a160b;--ok:#5fc08a;--warn-bg:#33281a;--warn-line:#54402a;--warn-ink:#e7c996}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Hanken Grotesk',system-ui,sans-serif}
.w{max-width:460px;margin:0 auto;padding:22px 16px 40px}
h1{font:700 22px/1.2 'Bricolage Grotesque',system-ui,sans-serif;margin:4px 0 2px}.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
.brand{font:700 13px 'Bricolage Grotesque',system-ui;letter-spacing:.12em;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px}
.seg{display:flex;gap:8px;margin:0 0 4px}.seg button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 6px;font:inherit;cursor:pointer}
.seg button b{display:block;font-size:18px}.seg button small{color:var(--mut);font-size:12px}.seg button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.h{font-weight:700;margin:0 0 4px}.m{color:var(--mut);font-size:13px}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);padding:13px;font:700 16px "Hanken Grotesk",system-ui,sans-serif;text-align:center;text-decoration:none;cursor:pointer;margin:10px 0 0}
.btn.alt{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}.btn[disabled]{opacity:.6}
.qr{display:block;margin:10px auto;width:190px;max-width:70%;border-radius:10px;border:1px solid var(--line)}
.upi{text-align:center;font-weight:700;letter-spacing:.02em;margin:0}
.sec{display:flex;align-items:center;gap:6px;color:#2f6b3a}.chips span{display:inline-flex;align-items:center;gap:5px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}.chips span{border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;color:var(--mut)}
.note{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:12px;padding:12px;font-size:14px}
.ok{background:#e9f6ee;border-color:#bfe3cc;color:var(--ok)}@media (prefers-color-scheme:dark){.ok{background:#1c2e24;border-color:#2f5440}}
.err{color:#b3261e;font-size:14px;margin:8px 0 0}
</style></head><body><div class="w">
<div class="brand">CRAVELLA BAKE HOUSE</div>
<div id="root"><p class="sub">Loading…</p></div>
</div>
<script>
const API='https://cravella-api.connect-679.workers.dev';
const q=new URLSearchParams(location.search),OID=q.get('o')||'',KEY=q.get('k')||'';
const root=document.getElementById('root');let S=null,kind='';
const inr=n=>'₹'+Number(n).toLocaleString('en-IN');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(action,extra){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action:action,id:OID,k:KEY},extra||{}))});let b={};try{b=await r.json()}catch(_){}return b}
function msg(t,cls){root.innerHTML='<h1>'+(cls==='ok'?'Thank you':'Pay for your order')+'</h1><div class="note '+(cls||'')+'" style="margin-top:12px">'+t+'</div>'}
function label(o){return o.kind==='bal'?'Balance':o.kind==='full'?'Full amount':(S&&o.amt*2===S.total?'50% advance':'Advance')}
function view(){
  if(!S||!S.ok){msg(esc((S&&S.error)||'This payment link is not valid. Please WhatsApp us on 98459-04310.'));return}
  if(S.state==='paid'){msg('Order '+esc(S.id)+' is paid in full. Nothing more to pay.','ok');return}
  if(S.state==='closed'){msg('Order '+esc(S.id)+' does not need a payment right now.');return}
  if(S.state==='wait'){msg('We are still confirming the final price for order '+esc(S.id)+'. We will WhatsApp you, and this page will then show the payment options.');return}
  const o=S.opts.find(x=>x.kind===kind)||S.opts[0];kind=o.kind;
  const tabs=S.opts.length>1?'<div class="seg">'+S.opts.map(x=>'<button data-k="'+x.kind+'" class="'+(x.kind===kind?'on':'')+'"><b>'+inr(x.amt)+'</b><small>'+label(x)+'</small></button>').join('')+'</div>':'';
  const upi='upi://pay?pa='+encodeURIComponent(S.upi)+'&pn='+encodeURIComponent('Cravella Bake House')+'&am='+o.amt+'&cu=INR&tn='+encodeURIComponent('Order '+S.id);
  root.innerHTML='<h1>Hi'+(S.first?' '+esc(S.first):'')+', pay for order '+esc(S.id)+'</h1><p class="sub">Order total '+inr(S.total)+(S.paid?' · '+inr(S.paid.amt)+' received':'')+'</p>'+
  '<div class="card"><p class="h">How much?</p>'+(tabs||'<p class="m">'+label(o)+' · '+inr(o.amt)+'</p>')+'</div>'+
  '<div class="card"><p class="h">Pay by UPI</p><p class="m">Scan the QR with any UPI app, or tap the button on your phone.</p><img class="qr" src="pay-qr.jpg" alt="Cravella UPI QR code"><p class="upi">'+esc(S.upi)+'</p>'+
  '<a class="btn" href="'+upi+'">Pay '+inr(o.amt)+' with UPI app</a><p class="m" style="margin:12px 0 0;text-align:center">If you scan the QR, please type <b>'+esc(S.id)+'</b> in the payment note so we know which order it is for. Then send us the payment screenshot on WhatsApp.</p></div>'+
  (S.rzp?'<div class="card"><p class="h">Cards or Netbanking</p><p class="m sec"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>Secure payment by Razorpay</p><img src="pay-methods.png" width="360" height="34" alt="Visa, Mastercard, American Express, RuPay, UPI and net banking accepted" style="display:block;margin:12px auto 14px;max-width:100%;height:auto"><button class="btn" id="rz">Pay '+inr(o.amt)+' by card / netbanking</button><div class="err" id="er"></div></div>':'');
  root.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{kind=b.dataset.k;view()});
  const rz=document.getElementById('rz');if(rz)rz.onclick=async()=>{rz.disabled=true;const r=await call('pay_rzp',{kind:kind});if(r&&r.ok&&r.url){location.href=r.url}else{rz.disabled=false;document.getElementById('er').textContent=(r&&r.error)||'Could not start the payment. Please try again.'}};
}
(async()=>{S=await call('pay_get');view();setInterval(async()=>{if(document.hidden||!S||!S.ok)return;const n=await call('pay_get');if(n&&n.ok&&(n.state!==S.state||JSON.stringify(n.paid)!==JSON.stringify(S.paid))){S=n;view()}},20000)})();
</script></body></html>
