.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}.mg .ht{min-height:88px;border-top:3px solid var(--ac)}.mg .ht i{font-size:26px}.ht i{font-style:normal;font-size:30px;line-height:1}.ht b{font-size:14px}.ht span{font-size:11.5px;color:var(--mut);min-height:14px}.ht em{position:absolute;top:6px;right:8px;background:#c1272d;color:#fff;font-style:normal;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.kp div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 11px}.kp b{display:block;font:800 25px 'Bricolage Grotesque',system-ui}.kp span{font-size:11.5px;color:var(--mut)}.kp .hot b{color:var(--acc)}
.sc{font:800 12px 'Hanken Grotesk';letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:22px 0 2px;display:flex;justify-content:space-between}
.tc .acts{margin-top:12px}.tc .acts .btn{flex:1 1 auto}.tc .acts .big{flex:1 1 100%;font-size:15.5px;padding:13px}
.up{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}.up:last-child{border-bottom:0}.up b{font-weight:700}.up small{display:block;color:var(--mut);font-size:12.5px}
.sk{height:128px;border-radius:18px;background:linear-gradient(90deg,#f6f0e3 25%,#fbf7ee 37%,#f6f0e3 63%);background-size:400% 100%;animation:sh 1.2s infinite;margin:12px 0}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:14px 8px;border-bottom:1px solid var(--line);font-size:16px;font-weight:700;text-align:left}.mi i{font-style:normal;font-size:22px;width:30px;text-align:center}
.empty{text-align:center;padding:30px 10px}.empty b{font-size:34px;display:block}
@media print{.nav{display:none!important}}
.top small#clk{font-weight:700;color:#7a3e1d;margin-top:2px;font-variant-numeric:tabular-nums}
.nav button{font-size:13px}.nav button i{font-size:22px}.chip{font-size:14.5px}
.vsh{list-style:none;cursor:pointer;position:relative;padding-right:24px}.vsh::-webkit-details-marker{display:none}
.vsh::after{content:'▾';position:absolute;right:2px;top:0;font-size:16px;color:var(--mut);transition:transform .2s}
details[open]>.vsh::after{transform:rotate(180deg)}
.vmini{margin-top:4px}
.vgrid{display:grid;grid-template-columns:1fr;gap:0 14px;align-items:start}
.vgrid>.card{margin:10px 0}
@media (min-width:760px){.wrap{max-width:960px}.nav .in{max-width:900px}.nav button{font-size:14.5px}.nav button i{font-size:24px}.hd h2{font-size:31px}.top h1{font-size:24px}.top small{font-size:13.5px}.top .lg{height:50px}.vgrid{grid-template-columns:1fr 1fr}.kp b{font-size:26px}}
@media (min-width:1200px){.wrap{max-width:1160px}.vgrid{grid-template-columns:1fr 1fr 1fr}.chip{font-size:15px}}
@media (max-width:380px){.nav button{font-size:12px}.chip{font-size:13.5px;padding:6px 10px}}
/* bottom tabs: 25% bigger text, glass look */
.nav{background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,248,236,.72))!important;-webkit-backdrop-filter:blur(20px) saturate(1.7)!important;backdrop-filter:blur(20px) saturate(1.7)!important;border-top:1px solid rgba(255,255,255,.75)!important;box-shadow:0 -6px 24px rgba(59,36,22,.10),inset 0 1px 0 rgba(255,255,255,.9)}
.nav .in{gap:6px}
.nav button{font-size:16.25px;padding:7px 2px 6px;border-radius:16px;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 1px 3px rgba(59,36,22,.06);transition:background .2s,transform .1s}
.nav button i{font-size:27px}
.nav button:active{transform:scale(.97)}
.nav button.on{background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(180,83,42,.16));border-color:rgba(180,83,42,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 4px 14px rgba(180,83,42,.18)}
body{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.save{bottom:calc(86px + env(safe-area-inset-bottom))}body.hasSave{padding-bottom:calc(184px + env(safe-area-inset-bottom))}
.toast{bottom:calc(112px + env(safe-area-inset-bottom))}
@media (min-width:760px){.nav button{font-size:18px}.nav button i{font-size:30px}}
@media (max-width:380px){.nav button{font-size:15px}.nav button i{font-size:25px}.nav .in{gap:4px}}
/* order card: rows and columns */
.o .oinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0 6px}
.o .oinfo>div{background:rgba(255,248,236,.7);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.o .oinfo .wide{grid-column:1/-1}
.o .oinfo small{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.o .oinfo b{font-weight:600;font-size:14.5px;word-break:break-word}
.o .otb{width:100%;border-collapse:separate;border-spacing:0;margin:10px 0 4px;font-size:14.5px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.o .otb th{background:#fbf3e4;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 10px}
.o .otb td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
.o .otb tbody tr:nth-child(even) td{background:rgba(255,248,236,.55)}
.o .otb .q{text-align:center;white-space:nowrap;width:1%}.o .otb .p{text-align:right;white-space:nowrap;width:1%}
.o .otb tfoot td{background:#fffaf1;color:var(--mut)}
.o .otb tfoot tr.tt td{color:var(--ink);font-weight:800;font-size:16px;background:#fbf3e4}
.o .otb tfoot tr.adv td{font-size:13px}
@media (max-width:420px){.o .otb{font-size:13.5px}.o .otb td,.o .otb th{padding:7px 8px}}
</style>

const KU=['g','ml','pcs','tsp','tbsp'];

const trim=(x,d)=>String(+(+x).toFixed(d));
const FR=[[0,''],[.125,'⅛'],[.25,'¼'],[.375,'⅜'],[.5,'½'],[.625,'⅝'],[.75,'¾'],[.875,'⅞']];
function fr(q){let w=Math.floor(q),f=q-w,best=0,bd=9;FR.forEach(([v],i)=>{const d=Math.abs(f-v);if(d<bd){bd=d;best=i}});if(Math.abs(f-1)<bd){w++;best=0}return(w||!FR[best][1]?w:'')+FR[best][1]}
function fmtAmt(q,u){
  q=+q||0;
  if(u==='g')return q>=1000?trim(q/1000,2)+' kg':trim(q,q<10?1:0)+' g';
  if(u==='ml')return q>=1000?trim(q/1000,2)+' l':trim(q,q<10?1:0)+' ml';
  if(u==='tsp'){if(q<.0625)return 'a pinch';return fr(q)+' tsp'+(q>=3&&Math.abs(q/1.5-Math.round(q/1.5))<1e-6?' ('+fr(q/3)+' tbsp)':'')}
  if(u==='tbsp'){if(q<.0625)return 'a pinch';return fr(q)+' tbsp'}
  return fr(q)+(q<=1?' pc':' pcs')
}

function recTbl(){

  return `<table class="kt"><tr><th>Ingredient</th><th>Amount</th><th>Stock</th></tr>${r.ing.map(g=>{
    const need=g.q*f,st=g.s&&(D.stock||[]).find(x=>x.id===g.s);let c='<span class="na">not tracked</span>';

    return `<tr><td>${esc(g.n)}</td><td>${esc(fmtAmt(need,g.u))}</td><td>${c}</td></tr>`}).join('')}</table>`
}

async function kAdjust(id,sign){
  const inp=document.querySelector(`[data-adj="${id}"]`),v=parseFloat(inp&&inp.value);
  if(!(v>0)){toast('Type an amount first');return}
  const x=D.stock.find(s=>s.id===id);if(!x)return;const prev=x.qty;x.qty=Math.max(0,Math.round((x.qty+sign*v)*100)/100);
  const y=scrollY;render();scrollTo(0,y);
  try{const r=await api({action:'admin_stock_adjust',id,delta:sign*v});if(r.ok){x.qty=r.qty;toast((sign>0?'Added to ':'Used from ')+x.name)}else{x.qty=prev;toast(r.error||'Could not update')}}
  catch(_){x.qty=prev;toast('No connection. Not saved.')}
  const y2=scrollY;render();scrollTo(0,y2)
}

    }

});

async function loadBake(){
  const d=bakeDate,r=await api({action:'admin_bake',date:d});if(d!==bakeDate)return;
  bake=r.ok?r:{rows:[],orders:[],error:r.error};const el=$('bakeRes');if(tab==='bake'&&el)el.innerHTML=bakeRes()
}
function bakeHtml(){
  let h=`<div class="card noprint"><label class="f" style="margin-top:0">Date</label><div class="row" style="gap:8px"><input class="i" type="date" id="bakeIn" value="${esc(bakeDate)}"><button class="btn sm" id="bakeGo">Show</button><button class="btn ol sm" id="bakePrint">Print</button></div>
  <div class="hint">Everything to bake or pack for this date, from orders that are not cancelled or delivered.</div></div>`;
  return h+`<div id="bakeRes">${bakeRes()}</div>`
}
function bakeRes(){
  let h='';
  if(!bake)return `<div class="hint">Loading…</div>`;
  if(bake.error)return `<div class="err">${esc(bake.error)}</div>`;
  h+=`<div class="sec">To make on ${esc(fmtD(bakeDate))}</div>`;
  h+=bake.rows.length?`<div class="card"><table>${bake.rows.map(r=>`<tr><td>${esc(r.name)}</td><td>× ${Number.isInteger(r.qty)?r.qty:r.qty.toFixed(1)}</td></tr>`).join('')}</table></div>`:`<div class="card"><div class="hint">Nothing booked for this date.</div></div>`;
  if(bake.orders.length)h+=`<div class="sec">Orders for this day</div><div class="card"><table>${bake.orders.sort((a,b)=>a.time.localeCompare(b.time)).map(o=>`<tr><td>${esc(o.time)} · ${esc(o.id)} · ${esc(o.name)}<div class="hint">${esc(o.mode)}${o.cake&&o.other?' · cakes + bakes':o.cake?' · cakes':' · bakes'} · ${esc(o.status)}</div></td><td></td></tr>`).join('')}</table></div>`;
  return h
}

const SCAN_P='You are reading a photo of a bakery recipe (handwritten or printed). Reply with ONLY one JSON object and no other text, in exactly this shape: {"name":"","makes":1,"unit":"pieces","ingredients":[{"name":"","qty":0,"unit":"g"}],"steps":["",""],"notes":""}. Rules: qty must be a number (write 1/2 as 0.5 and 1 1/2 as 1.5). unit must be one of g, ml, pcs, tsp, tbsp, cup, kg, l, oz, lb. makes and unit say how much the recipe yields (for example 12 and muffins); if the yield is not written use 1 and pieces. steps is one string per step, in order, without numbering. notes holds oven temperature, baking time and tips. Never invent anything that is not in the photo; leave it empty if you cannot read it.';

  return ok?tot:NaN}

const SDEN={flour:120,sugar:200,butter:227,chips:170};
const SGEN=['all','purpose','caster','essence','chocolate','white','plain','powdered'];
function scStock(name){
  const n=String(name||'').toLowerCase();

document.addEventListener('pointermove',e=>{if(!DR||e.pointerId!==DR.pid)return;e.preventDefault();
  const rows=[...DR.card.querySelectorAll('.sw[data-row]')],di=rows.indexOf(DR.row);
  for(let i=0;i<rows.length;i++){const r=rows[i];if(r===DR.row)continue;const b=r.getBoundingClientRect(),mid=b.top+b.height/2;
    if(i<di&&e.clientY<mid){DR.card.insertBefore(DR.row,r);break}
    if(i>di&&e.clientY>mid){DR.card.insertBefore(DR.row,r.nextSibling);break}}
  if(e.clientY<90)scrollBy(0,-14);else if(e.clientY>innerHeight-110)scrollBy(0,14)},true);
const dragEnd=e=>{if(!DR||e.pointerId!==DR.pid)return;const {row,card,hd}=DR;DR=null;row.classList.remove('dragging');try{hd.releasePointerCapture(e.pointerId)}catch(_){}
  if(card.dataset.list){const ids=[...card.querySelectorAll('.sw[data-row]')].map(r=>r.dataset.row);siteReorder(card.dataset.list,ids);return}
  const ids=[...card.querySelectorAll('.sw[data-row]')].map(r=>r.dataset.row),first=D.items.find(x=>x.id===ids[0]);if(!first)return;
  const g=first.group,dels=D.settings.del||[],slots=[];D.items.forEach((x,i)=>{if(x.group===g&&!dels.includes(x.id))slots.push(i)});
  const by={};D.items.forEach(x=>by[x.id]=x);if(slots.length!==ids.length)return;
  const before=slots.map(i=>D.items[i].id).join();slots.forEach((si,k)=>{D.items[si]=by[ids[k]]});
  if(before!==slots.map(i=>D.items[i].id).join()){D.orderDirty=true;dirty=true;toast('Order changed. Tap Save changes.')}render()};
document.addEventListener('pointerup',dragEnd,true);document.addEventListener('pointercancel',dragEnd,true);
$('panel').addEventListener('click',e=>{const m=e.target.closest('[data-mv]');if(!m)return;e.stopPropagation();
  const id=m.dataset.mv,d=+m.dataset.d,i=D.items.findIndex(x=>x.id===id),j=i+d;if(i<0||j<0||j>=D.items.length||D.items[j].group!==D.items[i].group)return;
  const t=D.items[i];D.items[i]=D.items[j];D.items[j]=t;D.orderDirty=true;dirty=true;render()},true);
$('saveBtn').onclick=async()=>{
  const b=$('saveBtn');b.disabled=true;b.textContent='Saving…';
  try{const s=D.settings,r=await api({action:'admin_settings_save',unavailable:s.unavailable,closed:s.closed,capCake:s.capCake,capOther:s.capOther,banner:s.banner});
    if(r.ok){D.settings=r.settings;if(D.orderDirty){const o=await api({action:'admin_menuorder',order:D.items.map(x=>x.id)});if(!o.ok){toast(o.error||'Could not save the order');return}D.settings.order=o.order;D.orderDirty=false}dirty=false;toast('Saved. The website is updated.')}else toast(r.error||'Could not save')}
  catch(_){toast('No connection')}finally{b.disabled=false;b.textContent='Save changes'}
};
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
/* ---------- phone Back button: closes sheets, steps back through tabs, never reveals the app after sign out ---------- */
function showSheet(id){const el=$(id),was=el.classList.contains('hide');el.classList.remove('hide');if(was){try{history.pushState({cb:'sheet'},'')}catch(_){}}}
function popSheet(){try{if(history.state&&history.state.cb==='sheet')history.back()}catch(_){}}
try{history.replaceState({cb:'tab',tab},'')}catch(_){}
addEventListener('popstate',e=>{
  if(!tok){showLogin();return}
  const CL={cpSheet:closeCust,pwSheet:closePw,edSheet:closeEd,mailSheet:closeMail,moreSheet:()=>$('moreSheet').classList.add('hide')};
  for(const id in CL){if(!$(id).classList.contains('hide')){CL[id]();return}}
  const st=e.state;if(st&&st.cb==='tab'&&st.tab!==tab){tab=st.tab;render();scrollTo(0,0)}
});
addEventListener('pageshow',e=>{if(e.persisted&&!tok)showLogin()});

setInterval(()=>{if(document.hidden||!tok||(tab!=='today'&&tab!=='home')||['cpSheet','pwSheet','edSheet','mailSheet','moreSheet'].some(i=>!$(i).classList.contains('hide')))return;loadOrders().then(()=>{if(tab==='today'||tab==='home')render()}).catch(()=>{})},60000);
boot();
$('panel').addEventListener('change',e=>{if(e.target.id==='brkMsg'&&D.site&&tab==='home'){const v=brkV();D.brkDraft={on:v.on,t:e.target.value};if(!brkDirty())D.brkDraft=null;render()}});
/* rename menu items */
async function renSave(id){const i=$('renIn');if(!i)return;const b=document.querySelector('[data-rensave]');if(b){b.disabled=true;b.textContent='Saving…'}
  try{const r=await api({action:'admin_menurename',id:id,name:i.value});if(r.ok){D.settings.names=r.names;D.renId=null;toast('Name saved. It is live on the website.');render()}else{toast(r.error||'Could not save');if(b){b.disabled=false;b.textContent='Save'}}}catch(_){toast('No connection');if(b){b.disabled=false;b.textContent='Save'}}}
$('panel').addEventListener('click',e=>{const a=e.target.closest('[data-ren]');if(a){e.preventDefault();D.renId=a.dataset.ren;render();const i=$('renIn');if(i){i.focus();i.select()}return}
  if(e.target.closest('[data-rencancel]')){D.renId=null;render();return}
  const sv=e.target.closest('[data-rensave]');if(sv){renSave(sv.dataset.rensave)}});
$('panel').addEventListener('keydown',e=>{if(e.target.id==='renIn'){if(e.key==='Enter'){e.preventDefault();renSave(D.renId)}else if(e.key==='Escape'){D.renId=null;render()}}});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
