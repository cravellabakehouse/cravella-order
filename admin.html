<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Cravella Admin</title>
<meta name="theme-color" content="#fffbbe">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#fffbbe;--bg:#fffdf6;--card:#ffffff;--ink:#3b2416;--mut:#7d6a58;--line:#eadfc9;--acc:#b4532a;--acc-ink:#fff;--ok:#2f7d4f;--bad:#b3261e;--shadow:0 1px 2px rgba(60,36,22,.06);--warn:#b06a00}
@media (prefers-color-scheme:dark){:root{--bg:#1d1612;--card:#271e18;--ink:#f6ece0;--mut:#b5a393;--line:#3c2f26;--acc:#e08a5e;--acc-ink:#2a160b;--ok:#5fc08a;--bad:#f2766e;--shadow:none;--warn:#e8b04b}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 'Hanken Grotesk',system-ui,sans-serif;min-height:100vh;padding-bottom:90px}
h1,h2,.t{font-family:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--acc)}
.top{background:var(--cream);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#3b2416}
.top h1{font-size:20px}.top small{display:block;font-size:12px;color:#6a5a2a}
.btn{display:inline-block;padding:11px 16px;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-weight:700;text-align:center}
.btn.ol{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.55}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:14px;background:var(--card)}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .n{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;border-radius:9px;background:var(--acc);color:var(--acc-ink);font-size:11px;line-height:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.i{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
label.f{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
.err{color:var(--bad);font-weight:600;margin-top:8px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;font-weight:600;background:var(--card)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#fff1c9;color:#7a5a00}
.pill.Confirmed{background:#d9efe1;color:#1f6b3d}.pill.Advance{background:#d6e8f7;color:#1c4f7c}.pill.Ready{background:#ffe0cf;color:#9a3d12}.pill.Delivered{background:#2f7d4f;color:#fff}.pill.Cancelled{background:#eee;color:#666}
.o .id{font-weight:700}
.o .m{color:var(--mut);font-size:14px}
.o .lines{white-space:pre-line;margin:8px 0;font-size:14.5px}
.o .when{font-weight:700;margin-top:6px}
.o .note{background:#fff4e4;color:#7a5a30;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px}
@media (prefers-color-scheme:dark){.o .note{background:#33281a;color:#e7c996}}
.st{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.st button{padding:7px 11px;border:1px solid var(--line);border-radius:10px;font-size:13px;font-weight:600;background:var(--card)}
.st button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ph img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.tg{position:relative;width:46px;height:26px;border-radius:13px;background:#bbb;flex:none;transition:.15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.tg.on{background:var(--ok)}.tg.on::after{left:23px}
.sec{font:700 13px 'Hanken Grotesk';letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:20px 0 4px}
.save{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);z-index:6}
.save .btn{display:block;width:100%;max-width:720px;margin:0 auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:.2s;max-width:90%}
.toast.on{opacity:1}
.stat{display:flex;gap:10px;margin:12px 0}
.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font:700 22px 'Bricolage Grotesque'}
.stat span{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse}td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.tm{display:flex;gap:4px 14px;flex-wrap:wrap;margin-top:6px;font-size:13.5px;font-weight:700}
.tm .g{color:var(--mut);font-weight:600}.tm .ok{color:var(--ok)}.tm .w{color:var(--warn)}.tm .r{color:var(--bad)}
.rep{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:#e5dcf7;color:#4b2c8a;margin-left:6px;vertical-align:1px}
.rep.new{background:#e1f0e4;color:#2c6a3c}
@media (prefers-color-scheme:dark){.rep{background:#3a2f57;color:#d6c8f5}.rep.new{background:#24382a;color:#9fd9ae}}
.hist{border-top:1px dashed var(--line);margin-top:10px;padding-top:6px;font-size:13.5px}
.hist .h{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
textarea.i{min-height:230px;resize:vertical;line-height:1.45}
.hide{display:none!important}
@media print{.top,.tabs,.save,.noprint{display:none!important}body{padding:0;background:#fff;color:#000}.card{box-shadow:none;border-color:#999}}
</style>
</head>
<body>
<div class="top"><div><h1>Cravella Admin</h1><small id="who">Orders and settings</small></div><button class="btn ol sm hide" id="out">Sign out</button></div>

<div id="login" class="wrap">
  <div class="card">
    <div class="t" style="font-size:20px">Sign in</div>
    <p class="hint">Only approved admin emails can sign in. We will email you a 6-digit code.</p>
    <label class="f">Email</label>
    <input class="i" id="aEmail" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com">
    <div id="codeBox" class="hide"><label class="f">6-digit code</label><input class="i" id="aCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456"></div>
    <div class="err" id="lErr"></div>
    <button class="btn" id="lGo" style="width:100%;margin-top:14px">Send code</button>
  </div>
</div>

<div id="app" class="hide">
  <div class="tabs" id="tabs"></div>
  <div class="wrap" id="panel"></div>
</div>
<div class="save hide" id="saveBar"><button class="btn" id="saveBtn">Save changes</button></div>
<div class="sheet hide" id="mailSheet"><div class="in" id="mailIn"></div></div>
<div class="toast" id="toast"></div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycby9cbU5BitbWeEFyYj2jAESAmIIvtLnEs85GHcKa_yxMGtX0k044V-Bp2dnLC0r6BP9Kg/exec';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const ST=(k=>{try{return localStorage.getItem(k)}catch(_){return null}});
const SS=((k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(_){}});
let tok=ST('cb_admin_tok')||'',me='',D={orders:[],statuses:[],settings:null,items:[],mails:{}},tab='orders',filt='active',q='',bakeDate='',bake=null,dirty=false,CM={},cq='',skew=0;
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}
async function api(p){const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token:tok},p))});return res.json()}
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayS=()=>ymd(new Date());
const nowMs=()=>Date.now()+skew;
const dueMs=(d,t)=>{const m=String(t).match(/^(\d+):(\d+) (AM|PM)$/);if(!m||!/^\d{4}-\d{2}-\d{2}$/.test(d))return 0;return Date.parse(d+'T'+pad((+m[1]%12)+(m[3]==='PM'?12:0))+':'+m[2]+':00+05:30')||0};
const dur=ms=>{const m=Math.floor(Math.abs(ms)/60000),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mi=m%60;return d?d+'d '+h+'h':h?h+'h '+mi+'m':mi+'m'};
const dueOf=o=>o.split?[{l:'Cakes due',ms:dueMs(o.date,o.time)},{l:'Bakes due',ms:dueMs(o.split.date,o.split.time)}]:[{l:'Due',ms:dueMs(o.date,o.time)}];
const fmtD=s=>{const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return s;return new Date(+m[1],m[2]-1,+m[3]).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})};

/* ---------- sign in ---------- */
function showLogin(msg){$('login').classList.remove('hide');$('app').classList.add('hide');$('saveBar').classList.add('hide');$('out').classList.add('hide');$('who').textContent='Orders and settings';if(msg)$('lErr').textContent=msg}
let step='email';
$('aEmail').value=ST('cb_admin_email')||'';
$('lGo').onclick=async()=>{
  const b=$('lGo'),e=$('aEmail').value.trim(),err=$('lErr');err.textContent='';b.disabled=true;
  try{
    if(step==='email'){
      if(!/^\S+@\S+\.\S+$/.test(e)){err.textContent='Please enter a valid email.';return}
      const r=await api({action:'otp_request',email:e,token:''});if(!r.ok){err.textContent=r.error||'Could not send the code.';return}
      SS('cb_admin_email',e);step='code';$('codeBox').classList.remove('hide');b.textContent='Sign in';$('aCode').focus()
    }else{
      const r=await api({action:'otp_verify',email:e,code:$('aCode').value,token:''});if(!r.ok){err.textContent=r.error||'That code is not right.';return}
      tok=r.token;const m=await api({action:'admin_me'});
      if(!m.ok){tok='';err.textContent='This email is not an approved admin.';step='email';$('codeBox').classList.add('hide');b.textContent='Send code';return}
      SS('cb_admin_tok',tok);me=m.email;start()
    }
  }catch(_){err.textContent='No connection. Please try again.'}finally{b.disabled=false}
};
$('out').onclick=async()=>{try{await api({action:'logout',token:tok})}catch(_){}tok='';SS('cb_admin_tok',null);step='email';$('codeBox').classList.add('hide');$('aCode').value='';$('lGo').textContent='Send code';showLogin()};

async function start(){
  $('login').classList.add('hide');$('app').classList.remove('hide');$('out').classList.remove('hide');$('who').textContent=me||'Signed in';
  bakeDate=ymd(new Date(Date.now()+86400000));
  await Promise.all([loadOrders(),loadSettings()]);render()
}
async function boot(){
  if(!tok){showLogin();return}
  try{const m=await api({action:'admin_me'});if(!m.ok){tok='';SS('cb_admin_tok',null);showLogin(m.error==='auth'?'':m.error);return}me=m.email;start()}
  catch(_){showLogin('No connection. Please reload.')}
}
async function loadOrders(){const r=await api({action:'admin_orders'});if(r.ok){D.orders=r.orders;D.statuses=r.statuses;D.mails=r.mails||{};if(r.now)skew=r.now-Date.now()}else if(r.error==='auth'){tok='';showLogin('Please sign in again.')}}
async function loadSettings(){const r=await api({action:'admin_settings_get'});if(r.ok){D.settings=r.settings;D.items=r.items;dirty=false}}

/* ---------- layout ---------- */
const TABS=[['orders','Orders'],['bake','Bake list'],['menu','Menu'],['cust','Customers'],['settings','Settings']];
function renderTabs(){
  const nNew=D.orders.filter(o=>o.status==='New').length;
  $('tabs').innerHTML=TABS.map(([k,n])=>`<button class="tab ${tab===k?'on':''}" data-tab="${k}">${n}${k==='orders'&&nNew?`<span class="n">${nNew}</span>`:''}</button>`).join('');
  $('saveBar').classList.toggle('hide',!(tab==='menu'||tab==='settings'));
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;render();scrollTo(0,0)});
function render(){CM=custMap();renderTabs();$('panel').innerHTML=tab==='orders'?ordersHtml():tab==='bake'?bakeHtml():tab==='menu'?menuHtml():tab==='cust'?custHtml():settingsHtml();if(tab==='bake'&&!bake)loadBake()}

/* ---------- orders ---------- */
const ACTIVE=['New','Confirmed','Advance received','Ready'];
function visible(){
  const t=todayS(),s=q.trim().toLowerCase();
  return D.orders.filter(o=>{
    if(s&&!(o.id+' '+o.name+' '+o.phone).toLowerCase().includes(s))return false;
    if(filt==='active')return ACTIVE.includes(o.status);
    if(filt==='today')return o.status!=='Cancelled'&&(o.date===t||(o.split&&o.split.date===t));
    if(filt==='new')return o.status==='New';
    return true;
  }).sort((a,b)=>filt==='all'?0:(a.date+a.time).localeCompare(b.date+b.time))
}
function ordersHtml(){
  const t=todayS(),act=D.orders.filter(o=>ACTIVE.includes(o.status)),tod=D.orders.filter(o=>o.status!=='Cancelled'&&(o.date===t||(o.split&&o.split.date===t)));
  const adv=act.filter(o=>o.status==='Confirmed').length;
  let h=`<div class="stat"><div><b>${D.orders.filter(o=>o.status==='New').length}</b><span>New</span></div><div><b>${tod.length}</b><span>Today</span></div><div><b>${adv}</b><span>Awaiting advance</span></div><div><b>${act.filter(o=>dueOf(o).some(x=>x.ms&&x.ms<=nowMs()+864e5)).length}</b><span>Due in 24h</span></div></div>
  <div class="chips">${[['active','Active'],['new','New'],['today','Today'],['all','All']].map(([k,n])=>`<button class="chip ${filt===k?'on':''}" data-f="${k}">${n}</button>`).join('')}<button class="chip" id="refresh">↻ Refresh</button></div>
  <input class="i" id="search" placeholder="Search name, phone or order number" value="${esc(q)}">`;
  const L=visible();
  h+=L.length?L.map(orderCard).join(''):`<div class="card"><div class="hint">No orders here.</div></div>`;
  return h;
}
function waLink(o,kind){
  const first=o.name.split(' ')[0],when=fmtD(o.date)+', '+o.time+(o.split?` (cakes) and ${fmtD(o.split.date)}, ${o.split.time} (other bakes)`:'');
  const m={c:`Hi ${first}, thank you for ordering from Cravella Bake House! Your order ${o.id} is confirmed for ${when}. Total: ${inr(o.total)}.`,
    a:`Hi ${first}, we have received your advance. Your order ${o.id} is booked for ${when}. Thank you!`,
    r:`Hi ${first}, your Cravella order ${o.id} is ready${o.mode==='Delivery'?' and out for delivery.':' for pickup.'}`}[kind];
  return 'https://wa.me/91'+o.phone.replace(/\D/g,'').slice(-10)+'?text='+encodeURIComponent(m)
}
function orderCard(o){
  const sc=o.status==='Advance received'?'Advance':o.status;
  const when=o.split?`Cakes: ${fmtD(o.date)}, ${esc(o.time)}<br>Other bakes: ${fmtD(o.split.date)}, ${esc(o.split.time)}`:`${fmtD(o.date)}, ${esc(o.time)}`;
  return `<div class="card o" data-id="${esc(o.id)}">
  <div class="row"><span class="id">${esc(o.id)} · ${esc(o.name)}${repBadge(o)}</span><span class="pill ${esc(sc)}">${esc(o.status)}</span></div>
  <div class="m">Placed ${esc(o.placed)} · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>${o.email?' · '+esc(o.email):''}</div>
  <div class="tm" data-id="${esc(o.id)}">${tmHtml(o)}</div>
  <div class="when">${o.mode==='Delivery'?'🚚 Delivery':'🛍 Pickup'} · ${when}</div>
  ${o.address?`<div class="m">${esc(o.address)}</div>`:''}
  <div class="lines">${esc(o.lines.join('\n'))}</div>
  ${o.discount?`<div class="m">Subtotal ${inr(o.subtotal)} · Discount −${inr(o.discount)}</div>`:''}
  <div class="row"><b>${inr(o.total)}${o.toConfirm?' (price to confirm)':''}</b><span class="m">Advance 50%: ${inr(o.total/2)}</span></div>
  ${o.notes?`<div class="note">${esc(o.notes)}</div>`:''}
  ${o.photos.length?`<div class="ph">${o.photos.filter(u=>/^https:\/\//.test(u)).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">🖼 Photo</a>`).join(' ')}</div>`:''}
  <div class="st">${D.statuses.map(s=>`<button data-s="${esc(s)}" class="${o.status===s?'on':''}">${esc(s)}</button>`).join('')}</div>
  ${o.email?`<label class="hint" style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" data-notify checked> Email the customer when I change status (Confirmed opens the editable email instead)</label>`:''}
  ${mailNote(o)}
  <div class="acts"><button class="btn sm" data-mail="${esc(o.id)}">✉ Email customer</button>${histBtn(o)}<a class="btn ol sm" target="_blank" rel="noopener" href="${esc(waLink(o,'c'))}">WhatsApp: Confirm</a><a class="btn ol sm" target="_blank" rel="noopener" href="${esc(waLink(o,'a'))}">Advance received</a><a class="btn ol sm" target="_blank" rel="noopener" href="${esc(waLink(o,'r'))}">Ready</a></div>${histBox(o)}</div>`
}
/* ---------- countdowns ---------- */
function tmHtml(o){
  const now=nowMs();let h='';
  if(o.placedMs)h+=`<span class="g">⏱ Placed ${dur(now-o.placedMs)} ago</span>`;
  if(ACTIVE.includes(o.status))dueOf(o).forEach(x=>{if(!x.ms)return;const dl=x.ms-now,c=dl<6*36e5?'r':dl<24*36e5?'w':'ok';
    h+=`<span class="${c}">${dl<0?'⚠ '+x.l.replace(' due','')+' overdue by '+dur(dl):'⏳ '+x.l+' in '+dur(dl)}</span>`});
  return h
}
setInterval(()=>{document.querySelectorAll('.tm[data-id]').forEach(el=>{const o=D.orders.find(x=>x.id===el.dataset.id);if(o)el.innerHTML=tmHtml(o)})},30000);

/* ---------- repeat customers ---------- */
const keyOf=o=>{const p=String(o.phone||'').replace(/\D/g,'').slice(-10);return p.length===10?'p'+p:(o.email?'e'+o.email.toLowerCase():'i'+o.id)};
function custMap(){const m={};D.orders.forEach(o=>{(m[keyOf(o)]=m[keyOf(o)]||[]).push(o)});Object.keys(m).forEach(k=>m[k].sort((a,b)=>(a.placedMs-b.placedMs)||a.id.localeCompare(b.id)));return m}
const spent=a=>a.filter(o=>o.status!=='Cancelled').reduce((t,o)=>t+o.total,0);
const sumLine=o=>o.lines.map(l=>l.split(' – ₹')[0]).join(', ').slice(0,140);
function repBadge(o){const a=CM[keyOf(o)]||[o];return a.length>1?`<span class="rep">Repeat customer · order ${a.indexOf(o)+1} of ${a.length}</span>`:`<span class="rep new">New customer</span>`}
function histRows(a,skip){return a.filter(x=>x!==skip).slice().reverse().map(x=>`<div class="h"><span>${esc(x.id)} · ${esc(x.placed)} · ${esc(x.status)}<div class="hint" style="margin-top:2px">${esc(sumLine(x))}</div></span><b>${inr(x.total)}</b></div>`).join('')}
function histBtn(o){const a=CM[keyOf(o)]||[];return a.length>1?`<button class="btn ol sm" data-hist="h_${esc(o.id)}">History (${a.length-1})</button>`:''}
function histBox(o){const a=CM[keyOf(o)]||[];return a.length>1?`<div class="hist hide" id="h_${esc(o.id)}"><div class="m"><b>${a.length} orders · ${inr(spent(a))} lifetime</b> (cancelled not counted)</div>${histRows(a,o)}</div>`:''}
function mailNote(o){const m=D.mails[String(o.id).toLowerCase()];return m?`<div class="hint">✉ Emailed ${m.n} time${m.n>1?'s':''} · last ${new Date(m.last).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}</div>`:''}
function custHtml(){
  const all=Object.keys(CM).map(k=>({k,a:CM[k]})),rp=all.filter(c=>c.a.length>1).length,s=cq.trim().toLowerCase();
  const L=all.filter(c=>!s||c.a.some(o=>(o.name+' '+o.phone+' '+o.email).toLowerCase().includes(s))).sort((x,y)=>y.a[y.a.length-1].placedMs-x.a[x.a.length-1].placedMs);
  let h=`<div class="stat"><div><b>${all.length}</b><span>Customers</span></div><div><b>${rp}</b><span>Repeat</span></div><div><b>${all.length?Math.round(rp*100/all.length):0}%</b><span>Repeat rate</span></div></div>
  <input class="i" id="cSearch" placeholder="Search name, phone or email" value="${esc(cq)}">`;
  h+=L.length?L.map(({k,a})=>{const l=a[a.length-1],em=a.map(o=>o.email).filter(Boolean).pop()||'';
    return `<div class="card"><div class="row"><span class="id" style="font-weight:700">${esc(l.name)}${a.length>1?'<span class="rep">Repeat</span>':'<span class="rep new">New</span>'}</span><b>${inr(spent(a))}</b></div>
    <div class="m"><a href="tel:${esc(l.phone)}">${esc(l.phone)}</a>${em?' · '+esc(em):''}</div>
    <div class="m">${a.length} order${a.length>1?'s':''} · last ${esc(l.placed)}${a.length>1?' · avg '+inr(spent(a)/a.filter(o=>o.status!=='Cancelled').length||0):''}</div>
    <div class="acts"><button class="btn ol sm" data-hist="c_${esc(k)}">Order history</button><a class="btn ol sm" target="_blank" rel="noopener" href="https://wa.me/91${esc(String(l.phone).replace(/\D/g,'').slice(-10))}">WhatsApp</a><button class="btn ol sm" data-mail="${esc(l.id)}">✉ Email</button></div>
    <div class="hist hide" id="c_${esc(k)}">${histRows(a)}</div></div>`}).join(''):`<div class="card"><div class="hint">No customers yet.</div></div>`;
  return h
}

/* ---------- email composer ---------- */
const MK=[['confirm','Confirmed'],['advance','Advance received'],['ready','Ready'],['thanks','Thank you'],['ask','Question']];
let MS=null;
function closeMail(){MS=null;$('mailSheet').classList.add('hide')}
async function openMail(id,kind,keepTo){
  const o=D.orders.find(x=>x.id===id);if(!o)return;
  MS={id,kind:kind||'confirm'};$('mailSheet').classList.remove('hide');if(!keepTo)$('mailIn').innerHTML='<div class="hint">Loading…</div>';
  const prevTo=keepTo&&$('mTo')?$('mTo').value:'';
  let r;try{r=await api({action:'admin_email_draft',id,kind:MS.kind})}catch(_){closeMail();toast('No connection');return}
  if(!r.ok){closeMail();toast(r.error||'Could not load');return}
  const to=prevTo||r.to||'';
  $('mailIn').innerHTML=`<div class="row"><div class="t" style="font-size:19px">Email ${esc(o.name.split(' ')[0])} · ${esc(o.id)}</div><button class="btn ol sm" id="mCancel">Close</button></div>
  <div class="chips">${MK.map(([k,n])=>`<button class="chip ${MS.kind===k?'on':''}" data-mk="${k}">${n}</button>`).join('')}</div>
  <label class="f" style="margin-top:4px">To</label><input class="i" id="mTo" type="email" inputmode="email" value="${esc(to)}" placeholder="customer@email.com">
  ${to?'':`<div class="hint">This customer ordered without signing in, so we have no email. Type one to send, or use the WhatsApp buttons.</div>`}
  <label class="f">Subject</label><input class="i" id="mSub" maxlength="150" value="${esc(r.subject)}">
  <label class="f">Message (you can edit it)</label><textarea class="i" id="mBody" maxlength="4000">${esc(r.body)}</textarea>
  <div class="err" id="mErr"></div>
  <button class="btn" id="mSend" style="width:100%;margin-top:12px">Send email</button>`
}
$('mailSheet').addEventListener('click',async e=>{
  if(e.target===$('mailSheet')||e.target.closest('#mCancel')){closeMail();return}
  const k=e.target.closest('[data-mk]');if(k&&MS){openMail(MS.id,k.dataset.mk,true);return}
  if(e.target.closest('#mSend')&&MS){
    const b=$('mSend'),err=$('mErr');err.textContent='';b.disabled=true;b.textContent='Sending…';const id=MS.id;
    try{const r=await api({action:'admin_email_send',id,to:$('mTo').value.trim(),subject:$('mSub').value,body:$('mBody').value});
      if(r.ok){const m=D.mails[id.toLowerCase()]||(D.mails[id.toLowerCase()]={n:0,last:0});m.n++;m.last=Date.now();closeMail();toast('Email sent to '+r.to);const y=scrollY;render();scrollTo(0,y)}
      else err.textContent=r.error||'Could not send.'}
    catch(_){err.textContent='No connection. Please try again.'}finally{b.disabled=false;b.textContent='Send email'}
  }
});
$('panel').addEventListener('click',async e=>{
  const f=e.target.closest('[data-f]');if(f){filt=f.dataset.f;render();return}
  const ml=e.target.closest('[data-mail]');if(ml){openMail(ml.dataset.mail,'confirm');return}
  const hb=e.target.closest('[data-hist]');if(hb){const x=document.getElementById(hb.dataset.hist);if(x)x.classList.toggle('hide');return}
  if(e.target.closest('#refresh')){await loadOrders();render();toast('Updated');return}
  const sb=e.target.closest('[data-s]');if(sb){
    const card=sb.closest('.o'),id=card.dataset.id,st=sb.dataset.s,o=D.orders.find(x=>x.id===id);if(!o||o.status===st)return;
    if(st==='Cancelled'&&!confirm('Cancel order '+id+'?'))return;
    const notify=st!=='Confirmed'&&!!(card.querySelector('[data-notify]')&&card.querySelector('[data-notify]').checked);
    sb.disabled=true;
    try{const r=await api({action:'admin_status',id,status:st,notify});if(r.ok){o.status=st;toast(st+(r.mailed?' · customer emailed':''));const y=scrollY;render();scrollTo(0,y);if(st==='Confirmed')openMail(id,'confirm')}else toast(r.error||'Could not update')}catch(_){toast('No connection')}
    return
  }
  const a=e.target.closest('[data-del]');if(a){const d=a.dataset.del;D.settings.closed=D.settings.closed.filter(x=>x!==d);dirty=true;render();return}
  if(e.target.closest('#addClosed')){const v=$('closedIn').value;if(!v)return;if(!D.settings.closed.includes(v))D.settings.closed.push(v);D.settings.closed.sort();dirty=true;render();return}
  if(e.target.closest('#bakeGo')){bakeDate=$('bakeIn').value;bake=null;render();return}
  if(e.target.closest('#bakePrint')){print();return}
  const tg=e.target.closest('[data-tg]');if(tg){const id=tg.dataset.tg,u=D.settings.unavailable,i=u.indexOf(id);if(i>=0)u.splice(i,1);else u.push(id);dirty=true;tg.classList.toggle('on');return}
});
$('panel').addEventListener('input',e=>{
  if(e.target.id==='search'){q=e.target.value;const pos=e.target.selectionStart;render();const s=$('search');s.focus();s.setSelectionRange(pos,pos)}
  if(e.target.id==='cSearch'){cq=e.target.value;const pos=e.target.selectionStart;render();const s=$('cSearch');s.focus();s.setSelectionRange(pos,pos)}
  if(['capCake','capOther','banner'].includes(e.target.id)){D.settings[e.target.id]=e.target.id==='banner'?e.target.value:Math.max(0,parseInt(e.target.value)||0);dirty=true}
});

/* ---------- bake list ---------- */
async function loadBake(){
  const d=bakeDate,r=await api({action:'admin_bake',date:d});if(d!==bakeDate)return;
  bake=r.ok?r:{rows:[],orders:[],error:r.error};const el=$('bakeRes');if(tab==='bake'&&el)el.innerHTML=bakeRes()
}
function bakeHtml(){
  let h=`<div class="card noprint"><label class="f" style="margin-top:0">Date</label><div class="row" style="gap:8px"><input class="i" type="date" id="bakeIn" value="${esc(bakeDate)}"><button class="btn sm" id="bakeGo">Show</button><button class="btn ol sm" id="bakePrint">Print</button></div>
  <div class="hint">Everything to bake or pack for this date, from orders that are not cancelled or delivered.</div></div>`;
  return h+`<div id="bakeRes">${bakeRes()}</div>`
}
function bakeRes(){
  let h='';
  if(!bake)return `<div class="hint">Loading…</div>`;
  if(bake.error)return `<div class="err">${esc(bake.error)}</div>`;
  h+=`<div class="sec">To make on ${esc(fmtD(bakeDate))}</div>`;
  h+=bake.rows.length?`<div class="card"><table>${bake.rows.map(r=>`<tr><td>${esc(r.name)}</td><td>× ${Number.isInteger(r.qty)?r.qty:r.qty.toFixed(1)}</td></tr>`).join('')}</table></div>`:`<div class="card"><div class="hint">Nothing booked for this date.</div></div>`;
  if(bake.orders.length)h+=`<div class="sec">Orders for this day</div><div class="card"><table>${bake.orders.sort((a,b)=>a.time.localeCompare(b.time)).map(o=>`<tr><td>${esc(o.time)} · ${esc(o.id)} · ${esc(o.name)}<div class="hint">${esc(o.mode)}${o.cake&&o.other?' · cakes + bakes':o.cake?' · cakes':' · bakes'} · ${esc(o.status)}</div></td><td></td></tr>`).join('')}</table></div>`;
  return h
}

/* ---------- menu availability ---------- */
function menuHtml(){
  const s=D.settings;if(!s)return '<div class="hint">Loading…</div>';
  let h=`<div class="hint" style="margin-top:12px">Switch an item off when it is sold out. Customers will see it as unavailable and cannot order it. Tap Save changes at the bottom.</div>`,g='';
  D.items.forEach(it=>{
    if(it.group!==g){if(g)h+='</div>';g=it.group;h+=`<div class="sec">${esc(g)}</div><div class="card" style="padding:4px 14px">`}
    const on=!s.unavailable.includes(it.id);
    h+=`<div class="sw"><span>${esc(it.name)}</span><button class="tg ${on?'on':''}" data-tg="${esc(it.id)}" aria-label="Available"></button></div>`
  });
  return h+'</div>'
}

/* ---------- settings ---------- */
function settingsHtml(){
  const s=D.settings;if(!s)return '<div class="hint">Loading…</div>';
  return `<div class="sec">Closed dates</div><div class="card"><div class="hint" style="margin-top:0">Customers cannot order for these dates (holidays, travel, festivals).</div>
  <div class="row" style="gap:8px;margin-top:10px"><input class="i" type="date" id="closedIn" min="${todayS()}"><button class="btn sm" id="addClosed">Add</button></div>
  <div class="chips">${s.closed.length?s.closed.map(d=>`<button class="chip on" data-del="${esc(d)}">${esc(fmtD(d))} ✕</button>`).join(''):'<span class="hint">No closed dates.</span>'}</div></div>
  <div class="sec">Daily limits</div><div class="card"><div class="hint" style="margin-top:0">When a day is full, customers are asked to pick another date. Use 0 for no limit.</div>
  <label class="f">Most cakes per day</label><input class="i" id="capCake" type="number" min="0" inputmode="numeric" value="${s.capCake}">
  <label class="f">Most bakes orders per day (cupcakes, muffins, cookies, brownies)</label><input class="i" id="capOther" type="number" min="0" inputmode="numeric" value="${s.capOther}">
  <div class="hint">Cakes count each cake. Bakes count each order. Cancelled orders free up a place.</div></div>
  <div class="sec">Notice on the website</div><div class="card"><div class="hint" style="margin-top:0">A short message shown at the top of the ordering page, such as "Closed 12 to 14 Oct for Diwali". Leave empty for none.</div>
  <input class="i" id="banner" maxlength="200" style="margin-top:10px" value="${esc(s.banner)}" placeholder="e.g. Closed 12–14 Oct for Diwali"></div>`
}
$('saveBtn').onclick=async()=>{
  const b=$('saveBtn');b.disabled=true;b.textContent='Saving…';
  try{const s=D.settings,r=await api({action:'admin_settings_save',unavailable:s.unavailable,closed:s.closed,capCake:s.capCake,capOther:s.capOther,banner:s.banner});
    if(r.ok){D.settings=r.settings;dirty=false;toast('Saved. The website is updated.')}else toast(r.error||'Could not save')}
  catch(_){toast('No connection')}finally{b.disabled=false;b.textContent='Save changes'}
};
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
boot();
</script>
</body>
</html>
